# Sub-Store Cloudflare Worker 配置
# 文档: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "sub-store"
main = "cloudflare/worker.js"
compatibility_date = "2024-01-01"

# 可选: 自定义域名
# routes = [
#   { pattern = "sub.example.com", custom_domain = true }
# ]

# 环境变量
[vars]
# 上游 Sub-Store 后端地址 (代理模式)
# 留空则使用 KV 模式 (独立运行)
UPSTREAM_URL = ""

# 认证令牌 (可选, 强烈建议设置)
# 设置后, 所有请求必须携带 ?token=YOUR_TOKEN 参数
AUTH_TOKEN = ""

# 缓存时间 (秒)
CACHE_TTL = "300"

# 路径前缀 (可选, 例如部署在子路径 /sub-store)
PATH_PREFIX = ""

# KV 命名空间绑定 (KV 模式必需)
[[kv_namespaces]]
binding = "SUB_STORE_KV"
id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"  # 开发环境可选

# 预览环境配置 (可选)
[env.preview]
name = "sub-store-preview"
[env.preview.vars]
UPSTREAM_URL = ""
CACHE_TTL = "60"
AUTH_TOKEN = ""
[[env.preview.kv_namespaces]]
binding = "SUB_STORE_KV"
id = "YOUR_KV_NAMESPACE_ID"
